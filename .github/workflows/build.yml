name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # Actions ট্যাবের "Run workflow" বাটনে হাতে চালানোর জন্য

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ ফোল্ডার রিপোতে না থাকলে এই ধাপ সেটা বানিয়ে নেয়
      - name: Create android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name bkash_app
          fi

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: bkash-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
